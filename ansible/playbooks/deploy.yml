---
# main ブランチの内容をアプリ3台（asia1 / europe1 / america1）と DB 1台（asia2）へデプロイする。
#
# 使い方（必ず ansible/ ディレクトリで実行する）:
#   ansible-playbook playbooks/deploy.yml                       # 本番デプロイ
#   ansible-playbook playbooks/deploy.yml -e rsync_dry_run=true # 転送内容の確認だけ
#   ansible-playbook playbooks/deploy.yml --limit 'asia1,localhost'  # アプリ1台だけ先行
#   ansible-playbook playbooks/deploy.yml -e deploy_serial=1         # アプリを1台ずつ流す
#
# 前提: ローカルの main が origin/main と一致し、webapp/ と etc/ に未コミット変更が無いこと。
#       条件を満たさない場合は何も変更せずに失敗する。
#
# 送るもの:
#   webapp/python/        -> アプリ3台 /home/isucon/webapp/python/
#   webapp/sql/           -> アプリ3台 /home/isucon/webapp/sql/
#   etc/nginx/            -> アプリ3台 /home/isucon/etc/nginx/
#   etc/postgresql/       -> DB 1台 /home/isucon/etc/postgresql/
#
# 反映先の /etc はリポジトリの etc/ を指す symlink にする:
#   /etc/nginx/nginx.conf                    -> /home/isucon/etc/nginx/nginx.conf
#   /etc/postgresql/16/main/postgresql.conf  -> /home/isucon/etc/postgresql/16/main/postgresql.conf
#
# 再起動は毎回行う（DB 再起動で切れた接続をアプリ側で張り直すため、DB -> アプリの順）。

- name: ローカルの main がデプロイ可能か確認する
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    repo: "{{ playbook_dir }}/../.."

  tasks:
    - name: origin を取得
      ansible.builtin.command:
        cmd: git -C {{ repo }} fetch --prune origin
      changed_when: false

    - name: origin/main の SHA を取得
      ansible.builtin.command:
        cmd: git -C {{ repo }} rev-parse origin/main
      register: origin_main
      changed_when: false

    - name: ローカル HEAD の SHA を取得
      ansible.builtin.command:
        cmd: git -C {{ repo }} rev-parse HEAD
      register: local_head
      changed_when: false

    - name: webapp と設定ファイルに未コミットの変更が無いことを確認
      ansible.builtin.command:
        cmd: git -C {{ repo }} status --porcelain -- webapp etc
      register: repo_dirty
      changed_when: false
      failed_when: repo_dirty.stdout | length > 0

    - name: HEAD が origin/main と一致することを確認
      ansible.builtin.assert:
        that:
          - local_head.stdout == origin_main.stdout
        fail_msg: >-
          HEAD ({{ local_head.stdout[:7] }}) が origin/main ({{ origin_main.stdout[:7] }}) と違う。
          main に切り替えて git pull してからデプロイすること。
        success_msg: "デプロイ対象: {{ origin_main.stdout[:7] }}"

    - name: デプロイ対象の SHA を後続の play に渡す
      ansible.builtin.set_fact:
        deploy_sha: "{{ origin_main.stdout }}"
        deploy_short: "{{ origin_main.stdout[:7] }}"


- name: DB 1台へ設定をデプロイする
  hosts: db
  gather_facts: false

  vars_files:
    - ../vars/pg_schema.yml

  vars:
    repo: "{{ playbook_dir }}/../.."
    remote_etc: /home/isucon/etc
    pg_conf: /etc/postgresql/16/main/postgresql.conf
    dry_run: "{{ rsync_dry_run | default(false) | bool }}"
    deploy_sha: "{{ hostvars['localhost']['deploy_sha'] | default('') }}"
    deploy_short: "{{ deploy_sha[:7] }}"
    rsync_excludes:
      - "--exclude=._*"
    rsync_opts: "{{ rsync_excludes + ['--mkpath'] + (['--dry-run'] if dry_run else []) }}"

  tasks:
    - name: ローカル確認の play が実行されているか確認
      ansible.builtin.assert:
        that:
          - deploy_sha | length > 0
        fail_msg: >-
          ローカル確認の play が実行されていない。--limit を使う場合は
          localhost も含めること（例: --limit 'asia1,localhost'）。

    - name: PostgreSQL 設定を同期
      ansible.posix.synchronize:
        src: "{{ repo }}/etc/postgresql/"
        dest: "{{ remote_etc }}/postgresql/"
        delete: true
        rsync_opts: "{{ rsync_opts }}"

    - name: /etc の設定ファイルを配布物への symlink にする
      ansible.builtin.file:
        src: "{{ remote_etc }}/postgresql/16/main/postgresql.conf"
        dest: "{{ pg_conf }}"
        state: link
        force: true
      become: true
      when: not dry_run

    - name: postgresql.conf の所有者を root にする
      # pg_ctlcluster は symlink 先を stat し、所有者が postgres でも root でもないと
      # 起動を拒否する（rsync は isucon で走るため配布直後は isucon 所有になる）
      ansible.builtin.file:
        path: "{{ remote_etc }}/postgresql/16/main/postgresql.conf"
        owner: root
        group: root
        mode: "0644"
      become: true
      when: not dry_run

    - name: PostgreSQL を再起動
      ansible.builtin.systemd:
        name: postgresql
        state: restarted
      become: true
      when: not dry_run

    - name: PostgreSQL が起動しているか確認
      ansible.builtin.command:
        cmd: systemctl is-active postgresql
      register: pg_svc
      changed_when: false
      failed_when: pg_svc.stdout | trim != "active"
      when: not dry_run

    - name: 接続を受け付けているか確認
      ansible.builtin.command:
        cmd: pg_isready -h 127.0.0.1 -p 5432
      register: pg_ready
      changed_when: false
      retries: 10
      delay: 2
      until: pg_ready.rc == 0
      when: not dry_run

    - name: 追加のインデックスを適用
      # 001-schema.sql はリポジトリ内のどこからも実行されないため、稼働中の DB へは
      # ここで流す。reset.sql も /api/initialize で同じものを作るが、initialize より先に
      # リクエストが来ても困らないようにデプロイ時点で作っておく。
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -v
          - "ON_ERROR_STOP=1"
          - -d
          - "{{ pg_db }}"
          - -c
          - "{{ item.sql }}"
      loop: "{{ pg_schema_ddl }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      become: true
      become_user: postgres
      when: not dry_run

    - name: インデックスが作成されたか確認
      # pg_schema_ddl の name は「作成される索引名」と一致させること。
      # ここでは public の索引名一覧と突き合わせて、足りないものがあれば失敗する。
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - -At
          - -d
          - "{{ pg_db }}"
          - -c
          - SELECT indexname FROM pg_indexes WHERE schemaname = 'public' ORDER BY indexname
      register: pg_index_check
      changed_when: false
      failed_when: >-
        pg_schema_ddl | map(attribute='name')
        | difference(pg_index_check.stdout_lines) | list | length > 0
      become: true
      become_user: postgres
      when: not dry_run

    - name: 外部アドレスで待ち受けているか確認（conf.d の listen_addresses）
      ansible.builtin.command:
        cmd: ss -ltn
      register: pg_listen
      changed_when: false
      failed_when: "'0.0.0.0:5432' not in pg_listen.stdout"
      when: not dry_run

    - name: 直近のログに PANIC が出ていないか確認
      ansible.builtin.command:
        cmd: tail -n 30 /var/log/postgresql/postgresql-16-main.log
      register: pg_log
      become: true
      changed_when: false
      failed_when: "'PANIC' in pg_log.stdout"
      when: not dry_run


- name: アプリ3台へデプロイする
  hosts: app
  # 既定は3台同時（forks = 3）。回線が細いときは -e deploy_serial=1 で1台ずつにする
  serial: "{{ deploy_serial | default('100%') }}"
  gather_facts: false

  vars:
    repo: "{{ playbook_dir }}/../.."
    remote_webapp: /home/isucon/webapp
    remote_etc: /home/isucon/etc
    dry_run: "{{ rsync_dry_run | default(false) | bool }}"
    deploy_sha: "{{ hostvars['localhost']['deploy_sha'] | default('') }}"
    deploy_short: "{{ deploy_sha[:7] }}"
    rsync_excludes:
      - "--exclude=.venv/"
      - "--exclude=__pycache__/"
      - "--exclude=._*"
    rsync_opts: "{{ rsync_excludes + ['--mkpath'] + (['--dry-run'] if dry_run else []) }}"
    # isucon-tools の tools/alp.sh と同じバージョンに揃える
    alp_version: "1.0.21"

  tasks:
    - name: ローカル確認の play が実行されているか確認
      ansible.builtin.assert:
        that:
          - deploy_sha | length > 0
        fail_msg: >-
          ローカル確認の play が実行されていない。--limit を使う場合は
          localhost も含めること（例: --limit 'asia1,localhost'）。

    - name: python 実装を同期
      ansible.posix.synchronize:
        src: "{{ repo }}/webapp/python/"
        dest: "{{ remote_webapp }}/python/"
        delete: true
        rsync_opts: "{{ rsync_opts }}"
      register: python_sync

    - name: SQL 定義を同期
      ansible.posix.synchronize:
        src: "{{ repo }}/webapp/sql/"
        dest: "{{ remote_webapp }}/sql/"
        delete: true
        rsync_opts: "{{ rsync_opts }}"

    - name: nginx 設定を同期
      ansible.posix.synchronize:
        src: "{{ repo }}/etc/nginx/"
        dest: "{{ remote_etc }}/nginx/"
        delete: true
        rsync_opts: "{{ rsync_opts }}"

    - name: Python の依存関係を同期
      ansible.builtin.command:
        cmd: /home/isucon/local/uv/uv sync --frozen --no-dev
        chdir: "{{ remote_webapp }}/python"
      when:
        - not dry_run
        - python_sync.changed

    - name: nginx 設定の構文を確認（配布したファイルを直接検証）
      ansible.builtin.command:
        cmd: nginx -t -c {{ remote_etc }}/nginx/nginx.conf
      become: true
      changed_when: false
      when: not dry_run

    - name: /etc/nginx/nginx.conf を配布物への symlink にする
      ansible.builtin.file:
        src: "{{ remote_etc }}/nginx/nginx.conf"
        dest: /etc/nginx/nginx.conf
        state: link
        force: true
      become: true
      when: not dry_run

    - name: デプロイしたコミットを記録
      ansible.builtin.copy:
        content: "{{ deploy_sha }}\n"
        dest: "{{ remote_webapp }}/DEPLOYED_COMMIT"
        mode: "0644"
      when: not dry_run

    # systemd の既定の soft limit は 1024。SSE が接続を保持するので両サービスで上げる。
    # nginx 側は nginx.conf の worker_rlimit_nofile でも同じ値を指定している。
    - name: アプリのファイルディスクリプタ上限を上げる
      ansible.builtin.copy:
        dest: /etc/systemd/system/isureal-python.service.d/limit-nofile.conf
        content: |
          [Service]
          LimitNOFILE=65536
        mode: "0644"
      become: true
      when: not dry_run

    - name: nginx のファイルディスクリプタ上限を上げる
      ansible.builtin.copy:
        dest: /etc/systemd/system/nginx.service.d/limit-nofile.conf
        content: |
          [Service]
          LimitNOFILE=65536
        mode: "0644"
      become: true
      when: not dry_run

    - name: systemd のユニット設定を再読み込み
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: not dry_run

    - name: isureal-python を再起動
      ansible.builtin.systemd:
        name: isureal-python
        state: restarted
      become: true
      when: not dry_run

    - name: nginx を再起動
      ansible.builtin.systemd:
        name: nginx
        state: restarted
      become: true
      when: not dry_run

    - name: isureal-python が起動しているか確認
      ansible.builtin.command:
        cmd: systemctl is-active isureal-python
      register: app_svc
      changed_when: false
      failed_when: app_svc.stdout | trim != "active"
      when: not dry_run

    - name: nginx が起動しているか確認
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_svc
      changed_when: false
      failed_when: nginx_svc.stdout | trim != "active"
      when: not dry_run

    - name: ファイルディスクリプタ上限が反映されているか確認
      ansible.builtin.command:
        cmd: systemctl show -p LimitNOFILE isureal-python nginx
      register: nofile_limit
      changed_when: false
      failed_when: nofile_limit.stdout_lines | select('ne', 'LimitNOFILE=65536') | list | length > 0
      when: not dry_run

    - name: アプリが応答するか確認（404 が返ればプロセスは生きている）
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        status_code: 404
        timeout: 5
      register: health
      retries: 10
      delay: 2
      until: health.status is defined and health.status == 404
      when: not dry_run

    - name: 記録したコミットが期待どおりか確認
      ansible.builtin.command:
        cmd: cat {{ remote_webapp }}/DEPLOYED_COMMIT
      register: deployed
      changed_when: false
      when: not dry_run

    - name: デプロイ結果を検証
      ansible.builtin.assert:
        that:
          - deployed.stdout | trim == deploy_sha
        fail_msg: "DEPLOYED_COMMIT ({{ deployed.stdout | trim }}) が期待値 ({{ deploy_sha }}) と違う"
        success_msg: "{{ inventory_hostname }}: {{ deploy_short }} を適用済み"
      when: not dry_run

    - name: 直近のログに例外が出ていないか確認
      ansible.builtin.command:
        cmd: journalctl -u isureal-python -n 30 --no-pager
      register: app_log
      changed_when: false
      failed_when: "'Traceback' in app_log.stdout"
      when: not dry_run

    # 解析ツール alp を /usr/local/bin に入れる（isucon-tools の tools/alp.sh と同じ手順）。
    # アプリの応答には影響しないよう、デプロイ検証のあとに実行する。
    # 既に同じバージョンが入っていればダウンロードも配置も skip する。
    - name: CPU アーキテクチャを確認
      ansible.builtin.command:
        cmd: uname -m
      register: alp_machine
      changed_when: false

    - name: alp の配布アーキテクチャ名を決める
      ansible.builtin.set_fact:
        alp_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(alp_machine.stdout | trim, '') }}"

    - name: alp の配布物があるアーキテクチャか確認
      ansible.builtin.assert:
        that:
          - alp_arch | length > 0
        fail_msg: "alp の配布物が無いアーキテクチャ: {{ alp_machine.stdout | trim }}"

    - name: 導入済み alp のバージョンを確認
      ansible.builtin.command:
        cmd: alp --version
      register: alp_current
      changed_when: false
      failed_when: false
      when: not dry_run

    - name: alp のアーカイブをダウンロード
      ansible.builtin.get_url:
        url: "https://github.com/tkuchiki/alp/releases/download/v{{ alp_version }}/alp_linux_{{ alp_arch }}.tar.gz"
        dest: "/tmp/alp_linux_{{ alp_arch }}.tar.gz"
        mode: "0644"
      when:
        - not dry_run
        - alp_current.stdout | default('') | trim != alp_version

    - name: alp を展開
      ansible.builtin.unarchive:
        src: "/tmp/alp_linux_{{ alp_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
      when:
        - not dry_run
        - alp_current.stdout | default('') | trim != alp_version

    - name: alp を /usr/local/bin に配置
      ansible.builtin.copy:
        src: /tmp/alp
        dest: /usr/local/bin/alp
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      become: true
      when:
        - not dry_run
        - alp_current.stdout | default('') | trim != alp_version

    - name: alp のアーカイブと展開物を削除
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/alp_linux_{{ alp_arch }}.tar.gz"
        - /tmp/alp
      when:
        - not dry_run
        - alp_current.stdout | default('') | trim != alp_version

    - name: alp のバージョンを確認
      ansible.builtin.command:
        cmd: alp --version
      register: alp_installed
      changed_when: false
      failed_when: alp_installed.stdout | trim != alp_version
      when: not dry_run
