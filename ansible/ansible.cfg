# Ansible の共通設定
# 実行は必ずこのディレクトリ（ansible/）で行う。ansible.cfg はカレントディレクトリから読み込まれる。

[defaults]
inventory = inventory.ini
# 3台を同時に流す（回線が細い場合は playbooks 側の serial で制御する）
forks = 3
# どの python を使うかは自動判定に任せる
interpreter_python = auto_silent
# 出力を読みやすくする
stdout_callback = default
result_format = yaml
# 鍵は inventory.ini 側で指定するので、ここでは指定しない
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# SSH 接続を多重化して rsync と systemctl の往復を減らす
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
pipelining = True
