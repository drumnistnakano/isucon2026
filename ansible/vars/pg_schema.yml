---
# 稼働中の DB に足す DDL。
#
# ここに並べたものが、deploy.yml（デプロイのたび）と db-apply.yml（単体実行）で流れる。
# 001-schema.sql は初期構築用で、リポジトリ内のどこからも実行されない。
# 稼働中の DB に反映したい DDL はここにも書くこと。
#
# 何度流しても壊れないように、必ず IF NOT EXISTS を付ける。
pg_db: isureal

pg_schema_ddl:
  - name: users_username
    sql: CREATE UNIQUE INDEX IF NOT EXISTS users_username ON users(username)
  - name: posts_author_id_posted_at
    sql: CREATE INDEX IF NOT EXISTS posts_author_id_posted_at ON posts(author_id, posted_at, id)
  # 申請中の確認・届いた申請 / 送った申請の一覧（Seq Scan していた）
  - name: friend_requests_pending_recipient
    sql: CREATE INDEX IF NOT EXISTS friend_requests_pending_recipient ON friend_requests(recipient_id) WHERE status = 'pending'
  - name: friend_requests_pending_requester
    sql: CREATE INDEX IF NOT EXISTS friend_requests_pending_requester ON friend_requests(requester_id) WHERE status = 'pending'
  # 認証のたびに token_hash で引く（Seq Scan していた）
  - name: login_sessions_active_token_hash
    sql: CREATE INDEX IF NOT EXISTS login_sessions_active_token_hash ON login_sessions(token_hash) WHERE active
